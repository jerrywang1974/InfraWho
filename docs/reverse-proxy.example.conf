# Example nginx snippet — TLS at the proxy; app listens on loopback HTTP.
# Pair with:
#   INFRAWHO_LISTEN_ADDR=127.0.0.1:8080
#   INFRAWHO_TRUST_PROXY=true
#   INFRAWHO_TRUSTED_ORIGINS=https://infrawho.example
#   INFRAWHO_COOKIE_SECURE=true
#
# Only enable TRUST_PROXY when clients cannot reach the app directly
# (otherwise X-Forwarded-* can be spoofed).
# Set HSTS here (not in the Go app). See also README "Production / reverse proxy".

server {
    listen 443 ssl http2;
    server_name infrawho.example;

    # ssl_certificate     /etc/ssl/certs/infrawho.example.fullchain.pem;
    # ssl_certificate_key /etc/ssl/private/infrawho.example.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
