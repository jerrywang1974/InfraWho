# Single-machine verification stack.
# Usage:
#   ./scripts/docker-lab-up.sh --verify
#   ./scripts/verify-smoke.sh --base http://127.0.0.1:18080
#
# Differs from docker-compose.yml mainly by fixed host port 18080 (avoids
# colliding with a developer lab on 8080) and a named project-friendly file.

name: infrawho-verify

services:
  infrawho:
    build:
      context: .
      target: runtime
    image: infrawho:verify
    ports:
      - "18080:8080"
    environment:
      INFRAWHO_DB_URL: "sqlite:///data/infrawho.db"
      INFRAWHO_MASTER_KEY_FILE: "/etc/infrawho/master.key"
      INFRAWHO_LISTEN_ADDR: ":8080"
      INFRAWHO_COOKIE_SECURE: "false"
      INFRAWHO_WEB_ROOT: "/app/web"
      INFRAWHO_KEY_VERSION: "kek-v1"
    volumes:
      - verify_data:/data
      - ./lab-master.key:/etc/infrawho/master.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

volumes:
  verify_data:
